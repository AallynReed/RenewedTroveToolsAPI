<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form with Bootstrap and Flask</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha1/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
</head>

<body>

    <div class="container mt-5">
        <form method="POST" enctype="multipart/form-data">
            {{ form.hidden_tag() }}

            <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                {{ form.title }}
            </div>

            <div class="mb-3">
                <label for="author" class="form-label">Author</label>
                {{ form.author }}
            </div>

            <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                {{ form.description }}
            </div>

            <div class="mb-3">
                <label for="category" class="form-label">Category</label>
                {{ form.category }}
            </div>

            <div class="mb-3" id="class-field-container" style="display:none;">
                <label for="class_field" class="form-label">Class</label>
                {{ form.class_field }}
            </div>

            <div class="mb-3">
                <label for="files" class="form-label">Files</label>
                {{ form.files }}
            </div>

            <div class="mb-3">
                <label for="preview" class="form-label">Preview (png, jpeg, jpg)</label>
                {{ form.preview }}
            </div>

            <button type="submit" class="btn btn-primary">Submit</button>
        </form>
    </div>

    <script>
        $(document).ready(function () {
            $('#category').change(function () {
                if ($(this).val() === 'Costumes') {
                    $('#class-field-container').show();
                } else {
                    $('#class-field-container').hide();
                }
            });
        });
    </script>

</body>

</html>
